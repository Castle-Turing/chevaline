# Ada's Chevaline profile — a fictional reference example.
# Exercises every section of SPEC.md §3 (3.1 through 3.10).

spec = "0.3"

[resident]
name = "Ada"

# An environment overlay for Ada's employer: a bigger, token-denominated
# budget against her employer's self-hosted open-weights models. The base
# below stays the conservative floor; this environment raises it only
# while Ada is actually inside the employer's repos.
[[environment]]
name = "work"
when.git_org = "acme"
when.path = "~/work/**"

  [environment.models]
  cheap = "qwen2.5-coder"
  deep  = "llama-3.3-405b"

  [environment.budget]
  on_exceed = "halt"
  limits = [
    { scope = "*", window = "session", amount = 5_000_000, unit = "tokens" },
  ]

# Try Claude Code first; fall back to Codex if it isn't available.
[harnesses]
prefer = ["claude-code", "codex"]

# Base model tiers: Ada's personal Anthropic account.
[models]
cheap    = "claude-haiku-4-5"
standard = "claude-sonnet-4-5"
deep     = "claude-opus-4-5"

# Base budget: Ada's own wallet, in dollars, on her personal account. This
# is the conservative floor — small and currency-denominated — that the
# work environment above raises for employer-funded, token-metered use.
[budget]
on_exceed = "halt"
limits = [
  { scope = "*",             window = "day", amount = 10, unit = "USD" },
  { scope = "claude-opus-*", window = "day", amount =  5, unit = "USD" },
]

# Portable prose, concatenated into whatever instruction channel the
# harness's adapter renders into.
[[instructions]]
path = "instructions/communication.md"

[[instructions]]
path = "instructions/testing-habits.md"
harnesses = ["claude-code"]   # Ada only wants this one read by Claude Code

# A standing check on Ada's own work. This is the canonical axis-1
# collision case, so compose is stated explicitly rather than left to
# the default.
[[gates]]
id = "second-model-review"
on = "merge"
description = "Get a second model's review before merging"
compose = "layer"
run = "scripts/second-opinion.py"

# Ada wants a fresh worktree per session, but defers to a project's own
# contribution flow when it already has one.
[sessions]
isolation = "worktree"
compose = "defer"

# How much latitude Ada's own agents get, per action class. Authority only
# tightens; it never loosens anything a project or harness already
# restricts. Authority composes with `restrict` implicitly and always —
# writing an explicit `compose` key here would be a validation error
# (SPEC §3.9), so this section deliberately has none.
[authority]
default = "reported"

[authority.actions]
"fs.write" = "silent"
"vcs.commit" = "reported"
"vcs.push" = "approval"
"vcs.publish" = "approval"
"deps.change" = "approval"
"net.fetch" = "silent"
"exec.install" = "approval"

# Executable content Ada uses to orchestrate her own agents.
[[extensions]]
id = "orchestrator"
run = "scripts/orchestrate.py"
description = "Fan out a task across several agent sessions"
